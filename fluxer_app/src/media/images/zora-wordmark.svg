<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 50" fill="none" role="img" aria-label="Zora">
  <defs>
    <linearGradient id="zora-radiant-gradient" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="45%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
  </defs>

  <!-- 8-Pointed Radiant Starburst Mark -->
  <g transform="translate(4, 2) scale(0.46)">
    <!-- North Ray -->
    <polygon points="46,38 50,10 54,38" fill="url(#zora-radiant-gradient)" />
    <!-- South Ray -->
    <polygon points="46,62 50,90 54,62" fill="url(#zora-radiant-gradient)" />
    <!-- West Ray -->
    <polygon points="38,46 10,50 38,54" fill="url(#zora-radiant-gradient)" />
    <!-- East Ray -->
    <polygon points="62,46 90,50 62,54" fill="url(#zora-radiant-gradient)" />
    <!-- North-West Ray -->
    <polygon points="43,40 23,23 39,43" fill="url(#zora-radiant-gradient)" />
    <!-- North-East Ray -->
    <polygon points="57,40 77,23 61,43" fill="url(#zora-radiant-gradient)" />
    <!-- South-East Ray -->
    <polygon points="57,60 77,77 61,57" fill="url(#zora-radiant-gradient)" />
    <!-- South-West Dynamic Needle Ray -->
    <polygon points="23,77 37,61 53,49 35,65" fill="url(#zora-radiant-gradient)" />
  </g>

  <!-- Wordmark -->
  <text
    x="60" y="34"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif"
    font-weight="800"
    font-size="28"
    letter-spacing="-0.8"
    fill="#FFFFFF"
  >
    Zora
  </text>
  <circle cx="128" cy="18" r="2.5" fill="#F97316" />
</svg>
